name: Build & Release

# Triggers:
#   - Every push / PR to main or master  → builds a debug APK and uploads it as
#     a workflow artifact (useful for testing before tagging).
#   - Every pushed tag matching v*.*.*   → builds a signed release APK and
#     publishes it as a GitHub Release with auto-generated release notes.

on:
  push:
    branches: [ main, master ]
    tags:     [ 'v*.*.*' ]
  pull_request:
    branches: [ main, master ]

# Needed so the release step can create and upload to a GitHub Release.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout source
        uses: actions/checkout@v4

      # ── Java ────────────────────────────────────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          # Caches ~/.gradle between runs — cuts build time by ~60 % after the
          # first run.
          cache: gradle

      # ── Gradle wrapper ──────────────────────────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x gradlew

      # ── Debug build (every push / PR) ───────────────────────────────────────
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          # SHA suffix makes each artifact uniquely addressable.
          name: tv-screensaver-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ── Release build (version tags only) ───────────────────────────────────
      # All four steps below are skipped on plain branch pushes / PRs.

      - name: Decode signing keystore
        if: startsWith(github.ref, 'refs/tags/v')
        # KEYSTORE_BASE64 must be the base64-encoded contents of your .jks file.
        # Generate it with:  base64 -w 0 release.jks
        # Then add the output as a GitHub Secret named KEYSTORE_BASE64.
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode \
            > "${{ github.workspace }}/release.jks"

      - name: Build release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename release APK to include version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/tv-screensaver-${VERSION}.apk
          echo "APK_PATH=app/build/outputs/apk/release/tv-screensaver-${VERSION}.apk" \
            >> "$GITHUB_ENV"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_PATH }}
          # Auto-generates release notes from commits since the previous tag.
          generate_release_notes: true
          fail_on_unmatched_files: true
